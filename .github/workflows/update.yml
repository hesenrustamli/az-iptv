name: Update playlist
on:
  schedule:
    - cron: "0 4 * * *"   # her gun saat 08:00 (Baki vaxti)
  workflow_dispatch:        # el ile de ise sala bilersiniz
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python generate_playlist.py
      - name: Commit changes
        run: |
          git config user.name "playlist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add playlist.m3u WAITING.md discovered.json
          if git diff --cached --quiet; then
            echo "no changes to playlist.m3u, WAITING.md or discovered.json"
          else
            git commit -F .bot_commit_msg
            git push
          fi
